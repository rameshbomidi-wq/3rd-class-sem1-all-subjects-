:root{--rail:#14202b;--rail2:#1d2e3c;--chalk:#f4efe2;--dim:#a7b6c1;--gold:#f2b134;--w:290px}

html,body{margin:0;height:100%;overflow:hidden;background:var(--rail);font-family:'Noto Sans Telugu',system-ui,sans-serif;color:var(--chalk)}

.top{padding:16px 16px 12px;border-bottom:1px solid #2c4152}
.top h1{margin:0;font:800 1.35rem/1.2 'Baloo Tamma 2',sans-serif;color:var(--gold)}
.top p{margin:4px 0 0;font-size:.85rem;color:var(--dim)}
#list{flex:1;overflow-y:auto;padding:10px 8px}
.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:2px solid transparent;color:var(--chalk);font:inherit;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:6px}
.it:hover{background:var(--rail2)}
.it.on{background:var(--rail2);border-color:var(--c)}
.it:focus-visible,.it.kf{outline:3px solid var(--gold);outline-offset:1px}
.ic{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:var(--c);display:grid;place-items:center;font:800 1.05rem 'Baloo Tamma 2',sans-serif;color:#fff}
.tx{flex:1;min-width:0}.tx b{display:block;font-size:1.05rem;line-height:1.3}.tx small{display:block;color:var(--dim);font-size:.78rem}
.kb{font-size:.75rem;color:var(--dim);border:1px solid #3a5163;border-radius:6px;padding:0 6px}
.help{padding:10px 16px;font-size:.74rem;color:var(--dim);line-height:1.6;border-top:1px solid #2c4152}
.brand{padding:10px 16px 14px;font:800 1.05rem 'Baloo Tamma 2',sans-serif;color:var(--gold)}
#main{flex:1;position:relative;min-width:0;background:#fff}
#main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
#main iframe.on{display:block}
#tog{position:fixed;left:calc(var(--w) + 3px);top:50%;transform:translateY(-50%);z-index:30;width:26px;height:64px;border:0;border-radius:0 10px 10px 0;background:var(--gold);color:#14202b;font-size:1rem;cursor:pointer;transition:left .2s ease;box-shadow:2px 0 6px rgba(0,0,0,.25)}
body.hide #tog{left:0}
#tog:focus-visible{outline:3px solid #fff}
#scrim{display:none}
@media (max-width:760px){
  #nav{position:fixed;left:0;top:0;bottom:0}
  body:not(.hide) #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
  body:not(.hide) #tog{left:calc(var(--w) + 3px)}
}
@media (prefers-reduced-motion:reduce){#nav,#tog{transition:none}}

<script>
(function(){
var body=document.body,main=document.getElementById('main'),tog=document.getElementById('tog');
var items=[].slice.call(document.querySelectorAll('.it')),frames={},cur=null,kf=0;
function dec(id){var b=atob(document.getElementById('d-'+id).textContent.trim());var u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
function setMenu(open){body.classList.toggle('hide',!open);tog.textContent=open?'◀':'▶';
  if(open){mark(Math.max(0,items.findIndex(function(x){return x.dataset.id===cur})));items[kf].focus();}
  else if(cur&&frames[cur]){try{frames[cur].contentWindow.focus();}catch(e){}}}
function mark(i){kf=(i+items.length)%items.length;items.forEach(function(x,j){x.classList.toggle('kf',j===kf)});items[kf].focus();}
function open(id){
  try{speechSynthesis.cancel()}catch(e){}
  if(!frames[id]){var f=document.createElement('iframe');f.title=id;f.setAttribute('allow','autoplay; fullscreen');f.srcdoc=dec(id);main.appendChild(f);frames[id]=f;}
  for(var k in frames)frames[k].classList.toggle('on',k===id);
  items.forEach(function(x){x.classList.toggle('on',x.dataset.id===id)});
  cur=id;try{localStorage.setItem('rai_c3_sub',id)}catch(e){}
  setMenu(false);
  setTimeout(function(){try{frames[id].contentWindow.focus()}catch(e){}},300);
}
items.forEach(function(x){x.addEventListener('click',function(){open(x.dataset.id)})});
tog.addEventListener('click',function(){setMenu(body.classList.contains('hide'))});
document.getElementById('scrim').addEventListener('click',function(){if(cur)setMenu(false)});
window.addEventListener('message',function(e){if(e.data==='rai-menu')setMenu(body.classList.contains('hide'));});
document.addEventListener('keydown',function(e){
  var k=e.key,menuOpen=!body.classList.contains('hide');
  if(k==='F2'||k==='ContextMenu'||k==='s'||k==='S'||k==='ColorF0Red'){e.preventDefault();setMenu(!menuOpen);return;}
  if(!menuOpen)return;
  if(k==='ArrowDown'){e.preventDefault();mark(kf+1)}
  else if(k==='ArrowUp'){e.preventDefault();mark(kf-1)}
  else if(k==='Enter'||k===' '){e.preventDefault();open(items[kf].dataset.id)}
  else if(/^[1-9]$/.test(k)&&+k<=items.length){e.preventDefault();open(items[+k-1].dataset.id)}
  else if((k==='Escape'||k==='Backspace'||k==='GoBack')&&cur){e.preventDefault();setMenu(false)}
});
var last=null;try{last=localStorage.getItem('rai_c3_sub')}catch(e){}
if(last&&document.getElementById('d-'+last)){open(last)}else{setMenu(true)}
})();
</script>
